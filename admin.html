<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>審核 · 尋影 TraceBack</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="尋影 TraceBack 的登錄審核頁，給主辦團隊確認登錄者是本人。">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></symbol>
  </svg>
  <header class="top">
    <a class="brand" href="index.html">
      <span class="logo"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg></span>
      <strong>尋影 TraceBack</strong>
      <span class="tag">審核</span>
    </a>
    <nav class="site-nav" aria-label="主選單">
      <a href="index.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>被冒用了</a>
      <a href="verify.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>查證代言</a>
      <a href="kol.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>本人登錄</a>
    </nav>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="theme-btn" aria-label="切換深色或淺色外觀">
        <svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        <svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <div class="status" id="status" role="status" aria-live="polite" hidden></div>
  <main>
    <section class="view">
      <h1>登錄審核</h1>
      <p class="lead">確認登錄者是本人後才開放查證。原型用人工審核代替正式的身分驗證：請透過登錄者的官方帳號私訊或其他管道確認。</p>
      <div class="grid">
        <label class="field">
          <span>管理員密碼</span>
          <input type="password" id="admin-token" autocomplete="off">
        </label>
        <label class="field">
          <span>顯示</span>
          <select id="filter">
            <option value="pending">待審核</option>
            <option value="approved">已開放</option>
            <option value="rejected">未通過</option>
          </select>
        </label>
      </div>
      <div class="row"><button type="button" class="primary" id="load">讀取</button></div>
      <p class="result-line" id="admin-result"></p>
      <ul class="inbox" id="kols"></ul>
    </section>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
